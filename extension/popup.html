<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>SIH Privacy Agent</title>
  <style>
    body{width:320px;margin:0;padding:16px;font:14px system-ui,sans-serif;color:#111}
    h1{font-size:18px;margin:0 0 6px}.sub{font-size:12px;color:#666;margin-bottom:12px}
    textarea{width:100%;height:82px;box-sizing:border-box;padding:10px;border:1px solid #ccc;border-radius:10px;resize:vertical}
    button{width:100%;margin-top:10px;padding:10px;border:0;border-radius:10px;background:#111;color:#fff;cursor:pointer}
    button:disabled{opacity:.5}.status{font-size:12px;margin-top:10px;color:#555;min-height:18px}
  </style>
</head>
<body>
  <h1>Privacy Visual Agent</h1>
  <div class="sub">DOM/text can be sanitized automatically. Images are never uploaded automatically.</div>
  <textarea id="prompt" placeholder="e.g. Find the checkout button and submit the form"></textarea>
  <button id="run">Run agent</button>
  <div class="status" id="status"></div>
  <script type="module" src="popup.js"></script>
</body>
</html>
